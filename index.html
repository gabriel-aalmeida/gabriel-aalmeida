<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gabriel Almeida | Engenharia de Software</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #12121a; --accent: #7c3aed;
      --accent2: #06b6d4; --text: #f0f0f5; --muted: #6b6b80; --border: #1e1e2e;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(12px); background: rgba(10,10,15,0.7); border-bottom: 1px solid var(--border); }
    .logo { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 1.2rem; color: var(--accent); }
    .nav-links a { color: var(--text); text-decoration: none; margin-left: 2rem; font-size: 0.9rem; font-weight: 600; transition: color 0.3s; }
    .nav-links a:hover { color: var(--accent); }
    header { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; position: relative; }
    .hero-tag { font-family: 'Space Mono', monospace; color: var(--accent2); margin-bottom: 1rem; display: block; }
    h1 { font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; line-height: 0.9; margin-bottom: 2rem; }
    .highlight { color: var(--accent); }
    #contato { padding: 100px 10%; background: var(--surface); }
    .contact-links { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
    .contact-link { color: var(--text); text-decoration: none; font-family: 'Space Mono', monospace; font-size: 1.1rem; transition: transform 0.3s; }
    .contact-link:hover { color: var(--accent2); transform: translateX(10px); }
  </style>
</head>
<body>
  <nav>
    <div class="logo">GABRIEL_ALMEIDA_</div>
    <div class="nav-links">
      <a href="#sobre">// sobre</a>
      <a href="#projetos">// projetos</a>
      <a href="#contato">// contato</a>
    </div>
  </nav>

  <header>
    <span class="hero-tag">Engenheiro de Software em Formação</span>
    <h1>Criando <span class="highlight">soluções</span><br>digitais.</h1>
  </header>

  <section id="contato">
    <h2>Vamos conversar</h2>
    <div class="contact-links">
      <a href="mailto:gabrieldealmeidaalfredo@gmail.com" class="contact-link">✉ Email</a>
      <a href="https://github.com/gabriel-aalmeida" target="_blank" class="contact-link">⌥ GitHub</a>
      <a href="https://www.linkedin.com/in/gabriel-almeida-90999a40b" target="_blank" class="contact-link">in LinkedIn</a>
    </div>
  </section>
</body>
</html>
</body>
</html>
